name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o bin/einvoice-mandates ./cmd/einvoice-mandates

      # The dataset is the product, so a warning in it fails the build too:
      # a citation older than the freshness promise is a defect.
      - name: Lint the dataset
        run: ./bin/einvoice-mandates validate -strict

      - name: Cut a release artefact and the static page
        run: |
          mkdir -p dist
          ./bin/einvoice-mandates build -release "ci-${GITHUB_SHA::7}" -allow-draft -o dist/release.json
          ./bin/einvoice-mandates render dist/release.json -o dist/index.html

      - name: Diff the build against the last published example
        run: ./bin/einvoice-mandates diff examples/release-2026.07.json dist/release.json

      - uses: actions/upload-artifact@v7
        if: matrix.go == '1.27'
        with:
          name: release-artefact
          path: dist/
          retention-days: 14
